name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: opto-linux-x86_64
            binary: target/release/opto
          - os: macos-15
            asset: opto-macos-aarch64
            binary: target/release/opto
          - os: windows-2022
            asset: opto-windows-x86_64.exe
            binary: target/release/opto.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      RUSTC_WRAPPER: sccache
    steps:
      - name: Check out repository and pinned dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-${{ matrix.os }}

      - name: Validate workspace
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Build release executable
        run: cargo build --release --bin opto --locked

      - name: Stage release asset
        shell: bash
        run: cp "${{ matrix.binary }}" "${{ matrix.asset }}"

      - name: Upload release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: sha256sum dist/* > dist/SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: dist/*
          generate_release_notes: true
