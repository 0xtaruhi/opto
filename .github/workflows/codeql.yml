name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/classify-changes.yml

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            os: ubuntu-24.04
          - language: python
            build-mode: none
            os: ubuntu-24.04
    steps:
      - name: Accept documentation-only change
        if: needs.changes.outputs.docs-only == 'true'
        run: echo "CodeQL inputs are unaffected by documentation-only changes."

      - name: Check out repository and pinned dependencies
        if: needs.changes.outputs.docs-only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Initialize CodeQL
        if: needs.changes.outputs.docs-only != 'true'
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze
        if: needs.changes.outputs.docs-only != 'true'
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4

  analyze-rust:
    name: Analyze (rust)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 4
      CARGO_TARGET_DIR: ${{ github.workspace }}/../opto-codeql-target
      # The extractor otherwise creates a fresh scratch target for every analysis.
      # Keep cached dependency-generated Rust outside the source tree so it is
      # loaded through its manifest instead of scanned as first-party source.
      CODEQL_EXTRACTOR_RUST_OPTION_CARGO_TARGET_DIR: ${{ github.workspace }}/../opto-codeql-target
      CMAKE_GENERATOR: Ninja
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Accept documentation-only change
        if: needs.changes.outputs.docs-only == 'true'
        run: echo "Rust CodeQL inputs are unaffected by documentation-only changes."

      - name: Check out repository and pinned dependencies
        if: needs.changes.outputs.docs-only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install latest stable Rust
        if: needs.changes.outputs.docs-only != 'true'
        run: rustup toolchain install stable --profile minimal

      - name: Install compiler cache
        if: needs.changes.outputs.docs-only != 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Restore Rust extraction cache
        if: needs.changes.outputs.docs-only != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: codeql-rust
          workspaces: . -> ../opto-codeql-target
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Prepare native build scripts
        if: needs.changes.outputs.docs-only != 'true'
        # Keep native compilation visible; extraction still runs the real build
        # scripts and procedural macros for both the workspace and fuzz manifests.
        run: cargo check -p opto-slang-sys -p opto-tcl-sys --all-features --locked

      - name: Initialize CodeQL
        id: init-rust
        if: needs.changes.outputs.docs-only != 'true'
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: rust
          build-mode: none
          # Public Linux runners have 16 GB; leave memory for the OS and build tools.
          ram: 12288
          threads: 4

      - name: Analyze
        id: analyze-rust
        if: needs.changes.outputs.docs-only != 'true'
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4

      - name: Require complete Rust extraction
        if: needs.changes.outputs.docs-only != 'true'
        env:
          CODEQL_PATH: ${{ steps.init-rust.outputs.codeql-path }}
          DATABASE: ${{ fromJSON(steps.analyze-rust.outputs.db-locations).rust }}
        run: |
          summary_dir="$DATABASE/results/codeql/rust-queries/queries/summary"
          "$CODEQL_PATH" bqrs decode --format=json \
            "$summary_dir/NumberOfSuccessfullyExtractedFiles.bqrs" \
            --output="$RUNNER_TEMP/codeql-rust-success.json"
          "$CODEQL_PATH" bqrs decode --format=json \
            "$summary_dir/NumberOfFilesExtractedWithErrors.bqrs" \
            --output="$RUNNER_TEMP/codeql-rust-errors.json"
          python3 tools/check_codeql_extraction.py \
            "$RUNNER_TEMP/codeql-rust-success.json" "$RUNNER_TEMP/codeql-rust-errors.json"

  analyze-native:
    name: Analyze (c-cpp)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Accept documentation-only change
        if: needs.changes.outputs.docs-only == 'true'
        run: echo "Native CodeQL inputs are unaffected by documentation-only changes."

      - name: Check out repository and pinned dependencies
        if: needs.changes.outputs.docs-only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Initialize CodeQL
        if: needs.changes.outputs.docs-only != 'true'
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: c-cpp
          build-mode: none
          config-file: ./.github/codeql/native.yml

      - name: Analyze
        if: needs.changes.outputs.docs-only != 'true'
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
