name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Public repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check first-party SPDX headers
        run: python3 tools/check_license_headers.py

      - name: Check Rust module documentation
        run: python3 tools/check_rust_documentation.py

      - name: Reject private and proprietary artifacts
        run: python3 tools/check_public_repository.py

      - name: Check test ownership and execution policy
        run: python3 tools/check_test_policy.py

      - name: Validate pinned real-world benchmark suite
        run: |
          python3 tools/check_real_benchmarks.py benchmarks/real/medium.toml
          python3 tools/check_real_benchmarks.py benchmarks/real/gate.toml

  dependency-policy:
    name: Dependency policy
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check advisories, licenses and sources; report duplicate crates
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  rust:
    name: Rust quality gates (${{ matrix.name }})
    if: github.event_name != 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS Intel
            os: macos-15-intel
          - name: macOS ARM
            os: macos-15
          - name: Windows MSVC
            os: windows-2022
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      RUSTC_WRAPPER: sccache
    steps:
      - name: Check out repository and pinned dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install latest stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install Linux quality components
        if: runner.os == 'Linux'
        run: rustup component add clippy rustfmt

      - name: Install compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: quality-${{ matrix.name }}

      - name: Record toolchain
        run: rustc --version --verbose

      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path fuzz/Cargo.toml --all --check

      - name: Check workspace architecture
        if: runner.os == 'Linux'
        run: python3 tools/check_architecture.py

      - name: Check workspace
        if: runner.os == 'Linux'
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Run Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run domain and library tests
        if: runner.os == 'Linux'
        run: cargo test --workspace --lib --bins --all-features --locked

      - name: Run product CLI tests
        if: runner.os == 'Linux'
        run: cargo test -p opto --test cli --all-features --locked

      - name: Run presubmit qualification
        if: runner.os == 'Linux'
        run: cargo test -p opto --test qualification --all-features --locked

      - name: Verify portable build, embedded Tcl and CLI
        if: runner.os != 'Linux'
        run: |
          cargo test -p opto-tcl-sys --locked
          cargo test -p opto --test cli --locked

      - name: Build runtime benchmarks
        if: runner.os == 'Linux'
        run: cargo bench --workspace --benches --no-run --locked

  coverage:
    name: Rust coverage
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      RUSTC_WRAPPER: sccache
    steps:
      - name: Check out repository and pinned dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install latest stable Rust
        run: rustup toolchain install stable --profile minimal --component llvm-tools-preview

      - name: Install compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2.85.8
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Generate LCOV report
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info --locked

      - name: Upload coverage trend
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: lcov.info
          fail_ci_if_error: false
