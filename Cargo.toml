[workspace]
members = [
    "crates/opto",
    "crates/opto-archive",
    "crates/opto-command-macros",
    "crates/opto-core",
    "crates/opto-db",
    "crates/opto-formats",
    "crates/opto-hdl",
    "crates/opto-ir",
    "crates/opto-library",
    "crates/opto-power",
    "crates/opto-runtime",
    "crates/opto-session",
    "crates/opto-slang-sys",
    "crates/opto-synth",
    "crates/opto-tcl-sys",
    "crates/opto-timing",
    "crates/opto-formal",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/0xtaruhi/opto"
license = "GPL-3.0-only"

[workspace.lints.rust]
warnings = "deny"
missing_docs = "deny"
unreachable_pub = "deny"
unsafe_code = "deny"
unused_must_use = "deny"
unused_imports = "deny"
unused_variables = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
bare_urls = "deny"

[workspace.dependencies]
anyhow = "1.0"
anstream = "1.0.0"
anstyle = "1.0.14"
annotate-snippets = "0.12.16"
blake3 = "1.8.2"
clap = { version = "4.5", features = ["derive"] }
comfy-table = { version = "8.0.0", default-features = false }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
directories = "6.0.0"
faer = { version = "0.24.4", default-features = false, features = ["std", "rayon", "sparse-linalg"] }
mimalloc = { version = "0.1.52", features = ["override", "v2"] }
opto-core = { path = "crates/opto-core", version = "0.1.0" }
opto-command-macros = { path = "crates/opto-command-macros", version = "0.1.0" }
opto-archive = { path = "crates/opto-archive", version = "0.1.0" }
opto-db = { path = "crates/opto-db", version = "0.1.0" }
opto-formats = { path = "crates/opto-formats", version = "0.1.0" }
opto-hdl = { path = "crates/opto-hdl", version = "0.1.0" }
opto-ir = { path = "crates/opto-ir", version = "0.1.0" }
opto-library = { path = "crates/opto-library", version = "0.1.0" }
opto-power = { path = "crates/opto-power", version = "0.1.0" }
opto-runtime = { path = "crates/opto-runtime", version = "0.1.0" }
opto-session = { path = "crates/opto-session", version = "0.1.0" }
opto-slang-sys = { path = "crates/opto-slang-sys", version = "0.1.0" }
opto-synth = { path = "crates/opto-synth", version = "0.1.0" }
opto-tcl-sys = { path = "crates/opto-tcl-sys", version = "0.1.0" }
opto-timing = { path = "crates/opto-timing", version = "0.1.0" }
opto-formal = { path = "crates/opto-formal", version = "0.1.0" }
rayon = "1.12"
reedline = "0.49.0"
rustsat = { version = "=0.7.5", default-features = false }
rustsat-cadical = "=0.7.5"
nu-ansi-term = "0.50.3"
proc-macro2 = "1.0"
quote = "1.0"
rkyv = { version = "0.8.18", default-features = false, features = ["bytecheck", "little_endian", "pointer_width_64", "std", "unaligned"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.11"
smallvec = { version = "1.15", features = ["serde"] }
syn = { version = "3.0", features = ["full"] }
thiserror = "2.0.18"
toml = "1.1.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = false

[profile.fast-release]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[profile.dev]
debug = true
opt-level = 1
lto = false
incremental = true

# Large unit-test targets retain line-level backtraces without embedding full
# debug-value information in every test binary. Keep this profile measured as
# described in docs/testing.md.
[profile.test]
debug = 1
opt-level = 1
lto = false
incremental = true
