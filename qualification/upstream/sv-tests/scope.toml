format = 1

# sv-tests is a general language-tool suite, not a synthesis suite. This
# manifest is the reviewed positive ASIC frontend contract. Directory entries
# include every positive test in that directory; upstream negative tests are
# audited but are not positive synthesis requirements.

[[feature]]
category = "numeric literals"
directory = "generic/number"

[[feature]]
category = "type declarations"
directory = "generic/typedef"

[[feature]]
category = "packed aggregate declarations"
directory = "generic/struct"

[[feature]]
category = "packed aggregate declarations"
directory = "generic/union"

