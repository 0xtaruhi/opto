format = 1
name = "scale-tiered"
description = "Generated tiered scale corpus for RFC 0013 Phase 3 scheduling acceptance"
generator = "generate.py"
top = "scale_top"

# Both clocks are declared so the multi-clock tiles are analysed rather than
# treated as a single domain. The periods are the constraint under which the
# phase gate is measured; they are not a frequency target for the corpus.
[[clocks]]
port = "clk"
period = 2.0

[[clocks]]
port = "secondary_clk"
period = 3.0

# RFC 0013 Phase 3 acceptance gates, expressed as reviewable data rather than
# hidden in the runner. Section "Phase 3: hierarchical local execution" states
# these are initial acceptance targets that may be revised only with checked
# benchmark evidence and an RFC amendment, never silently weakened here.
[guard]
# "at least 6x end-to-end synthesis speedup at sixteen workers over one worker"
minimum_speedup_at_sixteen_workers = 6.0
# "at least 70% average worker utilization during the main synthesis epochs"
minimum_average_worker_utilization = 0.70
# "coordinator, partition-publication, and commit time below 15% of total wall time"
maximum_coordinator_fraction = 0.15
# "at least eight ready fine tasks per worker during scalable phases"
minimum_ready_tasks_per_worker = 8
# "peak resident memory no greater than 1.5x the qualified one-worker path"
maximum_peak_memory_ratio = 1.5
# Worker counts swept by the harness. One and sixteen are required by the gate;
# four is retained because a monotonicity break between them is the signal that
# a scaling regression is structural rather than a measurement artefact.
worker_counts = [1, 4, 16]

# `measured_normalized_operations` is the calibration record: the value a
# measured run of this exact tier produced. A tier whose measurement is still
# zero has not been calibrated and must not be used as phase-gate evidence.
# Only the medium tier carries the RFC's "one million or more logical
# operations after sealing" requirement; the neighbouring tiers exist so a
# scaling claim can be read as a trend rather than a single point.

[[tiers]]
id = "scale-small"
tier = "small"
category = "scaling"
target_normalized_operations = 100_000
measured_normalized_operations = 0
gates_phase_three = false

