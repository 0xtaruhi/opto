format = 1
name = "real-medium-gate"
description = "Measured, currently executable subset of the pinned real RTL corpus"
threads = 8
maximum_parallel_cases = 8
library_sha256 = "ec0e1067a35c8bf20b11e58d1e8ac53326067e4dac84a125cc1b917a3518d0d9"

[guard]
minimum_cases = 14
minimum_timing_cases = 3
minimum_baseline_cells = 256
maximum_area_geomean_ratio = 1.00
maximum_area_case_ratio = 1.05
maximum_delay_geomean_ratio = 1.00
maximum_delay_case_ratio = 1.05

[[sources]]
id = "epfl"
url = "https://github.com/lsils/benchmarks/archive/0060e156826e733d69bf5b3322d1bdd0d03a1f9a.tar.gz"
sha256 = "55d92e23bd423999f68c1af8b9679d26c6fa6709a30211aa6750badc87f4003e"
revision = "0060e156826e733d69bf5b3322d1bdd0d03a1f9a"
license = "MIT"
citation = "https://www.epfl.ch/labs/lsi/page-102566-en-html/benchmarks/"

[[sources]]
id = "iwls2005"
url = "https://iwls.org/iwls2005/IWLS_2005_benchmarks_V_1.0.tgz"
