format = 1
id = "presubmit-known-zero-add32"
kind = "qor"
class = "presubmit"
scenario = "timing_constrained"
language = "verilog"
top = "top"
sources = ["top.v"]
flow = "synth"
equivalence = true
library = "../../../../../qualification/libraries/opto_test.lib"
report_timing = true
clock_period = 30.0
constraints = [
  "set input_ports [concat [get_ports a] [get_ports b]]",
  "set_input_transition 0.1 $input_ports",
  "set_load 0.05 [get_ports sum]",
  "set_max_delay 30.0 -from $input_ports -to [get_ports sum]",
]
# Feasible area recovery reduces 102.75 to 89.0 while retaining positive
# slack under the unchanged 30-unit requirement; Yosys CEC proves the result.
expected_area = 89.0
area_tolerance = 0.0
expected_cells = 57
cell_count_tolerance = 0.0
expected_worst_slack = 7.0
worst_slack_tolerance = 0.0
expected_total_negative_slack = 0.0
total_negative_slack_tolerance = 0.0
maximum_violating_paths = 0
maximum_wall_seconds = 60.0
maximum_cpu_seconds = 120.0
maximum_peak_rss_kib = 524288

[expected_cell_histogram]
AND2_X1 = 1
NAND2_X1 = 31
NOR2_X1 = 1
OR2_X1 = 1
XNOR2_X1 = 1
XOR2_X1 = 22
