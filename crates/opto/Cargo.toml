[package]
name = "opto"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false
description = "A Tcl-driven ASIC synthesis shell"
readme = "../../README.md"

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

[lints.rust]
warnings = "deny"
missing_docs = "deny"
unsafe_code = { level = "warn", priority = 1 }
unused_must_use = "deny"
unused_imports = "deny"
unused_variables = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

[lints.rustdoc]
all = { level = "deny", priority = -1 }
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
bare_urls = "deny"

[dependencies]
anstream.workspace = true
anstyle.workspace = true
annotate-snippets.workspace = true
clap.workspace = true
comfy-table = { workspace = true, features = ["tty"] }
directories.workspace = true
mimalloc = { workspace = true, optional = true }
nu-ansi-term.workspace = true
opto-core.workspace = true
opto-session.workspace = true
opto-command-macros.workspace = true
opto-formats.workspace = true
opto-tcl-sys.workspace = true
reedline.workspace = true
thiserror.workspace = true

[dev-dependencies]
libc = "0.2"
opto-library.workspace = true
serde.workspace = true
serde_json = "1.0"
sha2 = "0.11"
toml = "1.1.4"
